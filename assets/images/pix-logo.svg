<?xml version="1.0" encoding="UTF-8"?>
<!-- Símbolo Pix — inspirado no logo oficial do Banco Central do Brasil.
     4 losangos posicionados nas diagonais, formando o ícone característico do Pix. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pix">
  <!-- Losango superior-direito -->
  <rect x="55" y="5"  width="30" height="30" rx="5" ry="5" fill="#32BCAD" transform="rotate(45 70 20)"/>
  <!-- Losango inferior-direito -->
  <rect x="55" y="65" width="30" height="30" rx="5" ry="5" fill="#32BCAD" transform="rotate(45 70 80)"/>
  <!-- Losango inferior-esquerdo -->
  <rect x="15" y="65" width="30" height="30" rx="5" ry="5" fill="#32BCAD" transform="rotate(45 30 80)"/>
  <!-- Losango superior-esquerdo -->
  <rect x="15" y="5"  width="30" height="30" rx="5" ry="5" fill="#32BCAD" transform="rotate(45 30 20)"/>
</svg>
