<?xml version="1.0" encoding="UTF-8"?>
<!-- Símbolo Pix — logo oficial do Banco Central do Brasil.
     4 losangos simétricos posicionados nos quadrantes, formando o ícone característico do Pix. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pix">
  <!-- Losango superior-esquerdo -->
  <rect x="11" y="11" width="30" height="30" rx="4" ry="4" fill="#32BCAD" transform="rotate(45 26 26)"/>
  <!-- Losango superior-direito -->
  <rect x="59" y="11" width="30" height="30" rx="4" ry="4" fill="#32BCAD" transform="rotate(45 74 26)"/>
  <!-- Losango inferior-esquerdo -->
  <rect x="11" y="59" width="30" height="30" rx="4" ry="4" fill="#32BCAD" transform="rotate(45 26 74)"/>
  <!-- Losango inferior-direito -->
  <rect x="59" y="59" width="30" height="30" rx="4" ry="4" fill="#32BCAD" transform="rotate(45 74 74)"/>
</svg>
